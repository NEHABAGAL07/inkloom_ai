version: "3.8"

services:
  # Multi-tenant Relational Database
  db:
    image: postgres:15-alpine
    container_name: inkloom_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkloom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkloom_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-inkloom_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkloom_user -d inkloom_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inkloom_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-inkloom_user}:${POSTGRES_PASSWORD:-inkloom_dev_pw}@db:5432/${POSTGRES_DB:-inkloom_ai}
      ENVIRONMENT: development
      DEBUG: "true"
      AI_ENGINE_MODE: deterministic
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/workspace/backend
      - ./contracts:/workspace/contracts

  # Next.js Frontend Service
  frontend:
    image: node:18-alpine
    container_name: inkloom_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_USE_MOCK: "true"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
