name: Inkloom AI CI Pipeline

on:
  push:
    branches: [main, backend, feature/frontend, feature/ai-engine, feature/media-qa]
  pull_request:
    branches: [main]

jobs:
  backend-and-contracts:
    name: Backend Tests & Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run AI Quality & Evaluation Benchmark
        env:
          PYTHONPATH: .
        run: |
          cd backend
          python -m pytest tests/test_ai_evaluation.py -v -s

      - name: Run Backend & Security Tests
        env:
          PYTHONPATH: .
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend Production Build
        run: |
          cd frontend
          npm run build

