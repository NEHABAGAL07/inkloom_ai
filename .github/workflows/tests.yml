name: CI Tests & Quality Checks

on:
  push:
    branches: [main, backend, "feature/**"]
  pull_request:
    branches: [main, backend]

jobs:
  backend-and-contracts:
    name: Backend & Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Audit JSON Schema
        run: |
          python -c "
          import json, jsonschema
          schema = json.load(open('contracts/audit-result.schema.json'))
          example = json.load(open('contracts/audit-result.example.json'))
          jsonschema.validate(instance=example, schema=schema)
          print('✅ Audit schema validation passed!')
          "

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-do-not-use-in-prod
        run: |
          cd backend
          pytest -v

  frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Type check TypeScript
        run: |
          cd frontend
          npm run type-check || npx tsc --noEmit
